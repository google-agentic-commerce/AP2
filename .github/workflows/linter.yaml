name: Lint Code Base

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install TypeScript Sample Dependencies
        working-directory: code/samples/typescript
        run: npm ci

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: WARN
          # SC2164/SC2155: the sample scripts use the `$(cd ... && pwd)` /
          # `readonly X="$(...)"` idioms under `set -e`, where a failing cd or
          # command substitution already aborts, so these warnings do not apply.
          SHELLCHECK_OPTS: -e SC1091 -e SC2086 -e SC2164 -e SC2155
          VALIDATE_ALL_CODEBASE: false
          FILTER_REGEX_EXCLUDE: "^(\\.github/|\\.vscode/|code/samples/(python|go|android|certs)/).*|CODE_OF_CONDUCT.md|CHANGELOG.md"
          VALIDATE_BIOME_FORMAT: false
          # ESLint (with .github/linters/.eslintrc.json) is the JS/TS linter for
          # this project; disable Biome lint to avoid the documented Biome+ESLint
          # double-linting conflict super-linter warns about.
          VALIDATE_BIOME_LINT: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_CHECKOV: false
          VALIDATE_NATURAL_LANGUAGE: false
          MARKDOWN_CONFIG_FILE: ".markdownlint.json"
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_TYPESCRIPT_PRETTIER: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_YAML_PRETTIER: false
          VALIDATE_GIT_COMMITLINT: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_JSCPD: false
          VALIDATE_SHELL_SHFMT: false
          VALIDATE_GO: false
          VALIDATE_GO_MODULES: false
          VALIDATE_EDITORCONFIG: false
          VALIDATE_TRIVY: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
